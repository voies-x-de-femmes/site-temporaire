<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Voies(x) de femmes</title>

<style>
  body {
    margin: 0;
    background: #fff;
    font-family: Arial, sans-serif;
  }

  /* MAIN SECTION */
  .hero {
    position: relative;
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding-top: 40px;
  }

  /* IMAGE */
  .hero img {
    width: 70%;
    max-height: 85vh;
    object-fit: contain;
    display: block;
    margin: auto;
  }

  /* TEXT ON RIGHT */
  .text {
    position: absolute;
    top: 50%;
    right: 20%;
    transform: translateY(-50%);
    width: 28%;

    color: #e53935;
    font-style: italic;
    font-size: 1.5rem;
    line-height: 1.5;
  }

  /* EMAIL */
  .email {
    text-align: center;
    margin-top: 20px;
    color: #e53935;
    font-size: 14px;
  }

  .email a {
    color: #e53935;
    text-decoration: none;
  }

  /* MOBILE */
  @media (max-width: 768px) {

    .hero img {
      width: 100%;
    }

    .text {
      position: static;
      transform: none;
      width: 90%;
      margin: 20px auto;
      text-align: center;
      font-size: 1rem;
    }

    .email {
      margin-top: 10px;
      font-size: 30px;
    }
  }
</style>
</head>

<body>

<div class="hero">

  <img src="./Logo.jpeg" alt="Logo">

  <div class="text">
    Promouvoir, transmettre et faire rayonner la création artistique des femmes d’hier et d’aujourd’hui, à travers la connaissance, l’enseignement et la diffusion de leurs œuvres.
  </div>

</div>

<div class="email">
  <a href="mailto:voiesxdefemmes.association@gmail.com">
    Nous serons bientôt en ligne. En attendant, contactez-nous à : voiesxdefemmes.association@gmail.com
  </a>
</div>

</body>
</html>
