<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voies(x) de femmes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
    }

    .image-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .image-container img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
    }

    .link-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .link-container a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .link-container a:hover {
      text-decoration: underline;
    }

    @media (min-width: 900px) {
      .image-container img {
        width: 50vw;
      }
    }

    @media (max-width: 899px) {
      .image-container img {
        width: 100vw;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <div class="image-container">
      <img src="./Logo.jpeg" alt="logo of copany">
    </div>

    <div class="link-container">
      <a href="mailto:voiesxdefemmes.association@gmail.com">
        voiesxdefemmes.association@gmail.com
      </a>
    </div>

  </div>
</body>
</html>
