<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Image</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .image-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .link-container {
      padding: 10px 0 16px;
      text-align: center;
    }

    .link-container a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .link-container a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="image-container">
    <img src="Logo.jpg" alt="Fullscreen Image" />
  </div>

  <div class="link-container">
    <a href="voiesxdefemmes.association@gmail.com">voiesxdefemmes.association@gmail.com</a>
  </div>
</body>
</html>
